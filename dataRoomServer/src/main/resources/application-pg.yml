spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://127.0.0.1:5432/dataroom?currentSchema=public&rewriteBatchedStatements=true
    username: root
    password: 123456

dataroom:
  # Agent接入
  agent:
    model:
      # 模型提供方：dashscope（阿里百炼）、openai（OpenAI及兼容模型，如 DeepSeek）
      provider: ${DATAROOM_MODEL_PROVIDER:openai}
      # 模型名称
      model-name: ${DATAROOM_MODEL_NAME:gpt-6-astra}
      # API Key 必须通过环境变量注入，禁止填写真实密钥
      api-key: ${DATAROOM_MODEL_TOKEN}
      # 模型服务地址
      base-url: ${DATAROOM_MODEL_URL:https://api.openai.com/v1}