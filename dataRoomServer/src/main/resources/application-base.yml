spring:
  mvc:
    static-path-pattern: /static/**
    view:
      prefix: classpath:/static/
      suffix: .html
  web:
    resources:
      add-mappings: true
      static-locations: classpath:/static/,classpath:/META-INF/resources/,classpath:/META-INF/resources/webjars/,file:${dataroom.resource.basePath},file:${dataroom.resource.uiPath}
  servlet:
    # 文件上传大小限制
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  ai:
    mcp:
      server:
        name: dataroom-mcp-server
        version: ${project.version}
        type: sync
        protocol: streamable
        streamable-http:
          # MCP 访问地址  http://ip:port/context-path/mcp/sse
          mcp-endpoint: /mcp

dataroom:
  # Agent接入
  agent:
    enabled: true
    # Agent 工作区固定目录：包含 AGENTS.md、skills/、tools.json（可选扩展 MCP 服务）
    workspaceDir: ./agentWorkspace
    model:
      # 模型提供方：dashscope（阿里百炼）/ openai（OpenAI 及兼容端点，如 DeepSeek、Kimi）
      provider: openai
      model-name: gpt-6-astra
      # API Key 必须通过环境变量注入，禁止填写真实密钥
      api-key: sk-***
      # OpenAI 兼容端点地址，dashscope 默认留空即可
      base-url: https://api.openai.com/v1
      stream: true
      enable-thinking: true
      # 页面构建全流程在单次运行内完成（子代理已禁用），迭代数需覆盖"澄清+取组件 schema+建数据集+建页面+逐组件配置+校验"全链路
      max-iters: 60
  # 前端地址：Hash 模式需包含 /#/，History 模式填普通根地址
  uiUrl: http://localhost:5173/#/
  operation-log:
    # 不记录操作日志的 HTTP 路径，支持 Spring PathPattern，例如 /a/**
    exclude-paths:
      - /dataRoom/operationLog/page
      - /dataRoom/user/current
      - /dataRoom/mcpToken/add
      - /dataRoom/resource/file/**
  outboundHttp:
    # 内部目标白名单（字符串列表，默认空，修改后重启）：原 host:port 精确规则保持兼容。
    # regex: 前缀使用 Java 正则完整匹配规范化 host:port 或每个解析 IP:port；IPv6 为 [ip]:port。
    # 主机名转小写；URL 省略端口时使用协议默认端口。域名规则授权该域名，IP 规则逐个授权解析 IP。
    allowedInternalTargets:
      # 固定IP和端口样例
      - 192.168.52.86:9200
      # 使用正则匹配样例
      - 'regex:^192\.168\.\d{1,3}\.\d{1,3}:\d{1,5}$'
  cors:
    path-pattern: "/**"
    allowed-origin-patterns:
      - "*"
    allow-credentials: true
    allowed-methods:
      - "*"
    allowed-headers:
      - "*"
    exposed-headers:
      - "*"
  resource:
    # 资源上传存储路径，可以使用绝对路径
    basePath: ./dataRoomResource
    # 前端部署包所在目录，可以使用绝对路径，该目录下必须包含front文件夹
    uiPath: ./dataRoomFront
    urlPrefix: http://127.0.0.1:${server.port}${server.servlet.context-path}/static/
    storage:
      # 存储类型：local、s3
      type: local
      s3:
        endpoint: http://127.0.0.1:9000
        bucket: dataroom
        accessKey: dataroom
        secretKey: dataroom
        region: us-east-1
        pathStyleAccess: true
  # 公钥、用于加密
  publicKey: 
  # 私钥、用于解密、不可泄露
  privateKey: 
  # 集成单点登录
  sso:
    # 是否开启单点登录，非CAS协议的
    enable: false
    # 校验用户当前身份的接口，GET请求
    currentUserUrl: http://vue.ruoyi.vip/prod-api/getInfo
    # 适配器，可选值 ruoyi、default
    adapter: ruoyi
    # 对方系统token在请求头中的key名称
    headerKey: Authorization
    # 对方系统token对应的值前缀，如：Bearer
    headerValuePrefix: Bearer
  # CAS 单点登录，通过 REST 协议校验 ticket
  cas:
    # 是否开启CAS单点登录
    enable: false
    # CAS Server的服务地址
    serverUrlPrefix: http://127.0.0.1:8080/cas
    # DataRoom CAS Server 登录成功后的回调地址
    service: http://127.0.0.1:8081/dataRoom/cas/login
    # 校验ticket的接口（一般不用修改）
    serviceValidateSuffix: /p3/serviceValidate
    # 连接超时
    connectTimeout: 5s
    # 读取超时
    readTimeout: 5s
  jwt:
    issuer: dataRoom
    secret: 8cgZ3e8BGbj+GDyZW2vs4A5/qmDfshHLEm6FrciK3eI=
    expiration: 36000
    tokenKey: dataRoomToken
    alg: HS256

# AgentScope AG-UI 协议端点（SSE），完整路径为 ${server.servlet.context-path}/agui/run
agentscope:
  agui:
    path-prefix: /agui
    # 全局 CORS 已由 dataroom.cors 覆盖该路径，关闭 starter 自带的 CORS 避免重复响应头
    cors-enabled: false
    # 单次运行需覆盖完整大屏构建（慢模型下实测约 15-20 分钟），过短会导致 SSE 提前中断
    run-timeout: 30m
    emit-state-events: true
    emit-tool-call-args: true
    emit-token-usage: true
    default-agent-id: dataroom-designer
    enable-path-routing: true
    # 服务端按（用户, 线程）缓存并复用 Agent 实例，保证多轮对话上下文
    server-side-memory: true
    max-thread-sessions: 500
    session-timeout-minutes: 120
    enable-reasoning: true

# 接口文档配置
knife4j:
  # 开启增强配置
  enable: true
  basic:
    # 是否开启认证
    enable: false
    # 证用户名
    username: admin
    # 认证密码
    password: dataRoom
  setting:
    enable-footer: false

springdoc:
  # 解决实体本身默认会解析为参数问题 https://doc.xiaominfo.com/docs/faq/v4/knife4j-parameterobject-flat-param
  default-flat-param-object: true
  group-configs:
    # 项目上自定义的包名可以配置多个
    - group: 'DataRoom'
      paths-to-match:
        - '/**'
      # 扫描的包、可以配置多个
      packages-to-scan:
        - com.gccloud.gcpaas

mybatis-plus:
  configuration:
    # 使用可按Mapper控制的日志，避免MCP令牌hash被SQL参数日志输出。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.gccloud.gcpaas.dataroom.core.mapper.McpTokenMapper: 'OFF'
