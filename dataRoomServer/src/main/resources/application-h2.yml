spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:file:./db/dataroom;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: root
    password: dataRoom@2026
  sql:
    init:
      mode: always
      schema-locations: classpath:h2/dataroom_h2.all.sql
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # false 仅本机访问；true 允许局域网/外网访问（生产别开true）
        web-allow-others: false
        # 开启 H2 控制台的详细日志追踪
        trace: false
dataroom:
  # Agent接入
  agent:
    model:
      # 模型提供方：dashscope（阿里百炼）、openai（OpenAI 及兼容端点，如 DeepSeek、Kimi）
      provider: openai
      # 模型名称
      model-name: gpt-6-astra
      # API Key 必须通过环境变量注入，禁止填写真实密钥
      api-key: ${DATAROOM_AGENT_TOKEN}
      # OpenAI 兼容端点地址，dashscope 默认留空即可
      base-url: http://192.168.58.251:30000/v1