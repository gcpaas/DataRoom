spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:h2:file:./db/dataroom;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: root
    password: dataRoom@2026
  sql:
    init:
      mode: always
      schema-locations: classpath:h2/dataroom_h2.all.sql
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        # false 仅本机访问；true 允许局域网/外网访问（生产别开true）
        web-allow-others: false
        # 开启 H2 控制台的详细日志追踪
        trace: false
dataroom:
  # Agent接入
  agent:
    model:
      # 模型提供方：dashscope（阿里百炼）、openai（OpenAI及兼容模型，如 DeepSeek）
      provider: ${DATAROOM_MODEL_PROVIDER:openai}
      # 模型名称
      model-name: ${DATAROOM_MODEL_NAME:gpt-6-astra}
      # API Key 必须通过环境变量注入，禁止填写真实密钥
      api-key: ${DATAROOM_MODEL_TOKEN}
      # 模型服务地址
      base-url: ${DATAROOM_MODEL_URL:https://api.openai.com/v1}